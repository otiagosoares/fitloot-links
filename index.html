<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit Loot | Achados Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#12163A;--navy2:#1B1F4B;--blue:#2F6BFF;--orange:#FF8A2B;--purple:#7B4DFF;--text:#F2F4FF;--muted:#A9B0DB}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;
    background-image:radial-gradient(600px 300px at 50% -50px,rgba(47,107,255,.35),transparent),radial-gradient(400px 300px at 100% 100%,rgba(123,77,255,.25),transparent);
    padding:32px 18px calc(32px + env(safe-area-inset-bottom))}
  .wrap{max-width:480px;margin:0 auto}
  header{text-align:center;margin-bottom:26px}
  .logo{width:88px;height:88px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 0 0 3px var(--navy),0 0 0 5px var(--blue),0 0 28px rgba(47,107,255,.6)}
  .logo span{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:38px;letter-spacing:1px}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:34px;letter-spacing:.5px;text-transform:uppercase}
  h1 b{color:var(--orange)}
  .sub{color:var(--muted);font-size:14px;margin-top:6px}
  .platform{margin-bottom:14px;border-radius:16px;background:var(--navy2);border:1px solid rgba(255,255,255,.08);overflow:hidden}
  .btn{width:100%;display:flex;align-items:center;gap:12px;padding:16px 18px;background:none;border:0;color:var(--text);
    cursor:pointer;text-align:left;font:inherit}
  .btn .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .btn .name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.5px;flex:1}
  .btn .tag{font-size:12px;color:var(--muted)}
  .btn .chev{transition:transform .2s;color:var(--orange);font-size:20px}
  .platform.open .chev{transform:rotate(90deg)}
  .platform.open{border-color:var(--blue);box-shadow:0 0 18px rgba(47,107,255,.3)}
  .list{display:none;padding:0 12px 12px}
  .platform.open .list{display:block}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 10px;margin-top:8px;
    background:var(--navy);border-radius:12px;color:var(--text);text-decoration:none;border:1px solid rgba(255,255,255,.06)}
  .item:active{transform:scale(.99)}
  .item .t{font-size:14px;font-weight:600;line-height:1.3}
  .item .p{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;color:var(--orange);white-space:nowrap}
  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
  footer strong{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span>FL</span></div>
    <h1>Fit <b>Loot</b></h1>
    <p class="sub">Achados fit com cara de item raro. Escolha a loja e pegue o loot do dia.</p>
  </header>
  <main id="app"></main>
  <footer>
    <p><strong>Links de afiliado.</strong> Se você comprar por eles, eu posso receber uma comissão, sem custo extra para você.</p>
    <p>Preços vistos em 24/11/2026 e podem mudar. Confira na loja antes de comprar.</p>
  </footer>
</div>
<script>
var DATA = [
 {name:"Mercado Livre", color:"#FFE600", tag:"suplementos e treino em casa", items:[
  ["Creatina Growth (pote 250g)","R$ 64","https://meli.la/1TC7a9k"],
  ["Creatina Max Titanium 300g","R$ 78","https://meli.la/2HLnex1"],
  ["Creatina Integralmedica Hardcore 300g","R$ 79","https://meli.la/21u8TJq"],
  ["Whey concentrado Max Titanium 900g","R$ 250","https://meli.la/2eZYfLV"],
  ["Whey concentrado Growth 900g","R$ 172","https://meli.la/2vGdAoY"],
  ["Whey isolado Dux 900g","R$ 389","https://meli.la/2xFSEBS"],
  ["Xiaomi Smart Band 10","R$ 339","https://meli.la/2LgcSxG"],
  ["Kit halteres ajustáveis 6 em 1 (15kg)","R$ 280","https://meli.la/1eYyUMu"],
  ["Kit faixas elásticas + mini bands","R$ 39","https://meli.la/2SZUxKp"],
  ["Corda de pular com rolamento","R$ 39","https://meli.la/2RMZtnr"]]},
 {name:"Shopee", color:"#EE4D2D", tag:"treino, moda fitness e acessórios", items:[
  ["Kit mini bands 2/5/10","R$ 14,99","https://s.shopee.com.br/4LLCBsGWpk"],
  ["Corda de pular aço com rolamento","R$ 22,99","https://s.shopee.com.br/3LSf0CTdHv"],
  ["Kit halter barra 10kg 2 em 1","R$ 139,75","https://s.shopee.com.br/50aszGs17x"],
  ["Legging cintura alta","R$ 25,90","https://s.shopee.com.br/80EUYnBKGs"],
  ["Conjunto legging + top","R$ 48,00","https://s.shopee.com.br/30pobc3cy9"],
  ["Kit 3 tops com bojo","R$ 24,93","https://s.shopee.com.br/8KrKxQDi1f"],
  ["Bandagem de boxe / muay thai","R$ 16,50","https://s.shopee.com.br/30pobhNXLT"],
  ["Coqueteleira 600ml com esfera","R$ 28,90","https://s.shopee.com.br/9pg8kGSJzM"],
  ["Luva de academia neoprene","R$ 18,04","https://s.shopee.com.br/7VIDxzA3dv"],
  ["Colchonete / tapete yoga EVA","R$ 79,99","https://s.shopee.com.br/5VX9aJmTDp"]]},
 {name:"Amazon", color:"#FF9900", tag:"whey, wearables e legging", items:[
  ["Whey Gold Standard Optimum 907g","R$ 337,90","https://www.amazon.com.br/dp/B002DYIZH6?tag=fitloot2-20"],
  ["Whey isolado Dux 900g","R$ 302,00","https://www.amazon.com.br/dp/B07MLXXJD5?tag=fitloot2-20"],

  ["Xiaomi Smart Band 10 (versão ES)","R$ 282,15","https://www.amazon.com.br/dp/B0FCSGCL62?tag=fitloot2-20"],
  ["Huawei Band 10","R$ 189,00","https://www.amazon.com.br/dp/B0DWFQCY3V?tag=fitloot2-20"],
  ["Legging Lupo","R$ 118,62","https://www.amazon.com.br/dp/B00B4NNLVM?tag=fitloot2-20"]]}
];
var app = document.getElementById('app');
DATA.forEach(function(pl, i){
  var box = document.createElement('section'); box.className = 'platform';
  var b = document.createElement('button'); b.className = 'btn'; b.setAttribute('aria-expanded','false');
  b.innerHTML = '<span class="dot" style="background:'+pl.color+'"></span><span class="name">'+pl.name+'<br><span class="tag" style="font-family:Inter;text-transform:none;font-weight:400">'+pl.tag+'</span></span><span class="chev">&#9656;</span>';
  var list = document.createElement('div'); list.className = 'list';
  pl.items.forEach(function(it){
    var a = document.createElement('a'); a.className = 'item'; a.href = it[2]; a.target = '_blank'; a.rel = 'noopener sponsored';
    var t = document.createElement('span'); t.className = 't'; t.textContent = it[0];
    var p = document.createElement('span'); p.className = 'p'; p.textContent = it[1];
    a.appendChild(t); a.appendChild(p); list.appendChild(a);
  });
  b.addEventListener('click', function(){
    var open = box.classList.toggle('open'); b.setAttribute('aria-expanded', open);
  });
  box.appendChild(b); box.appendChild(list); app.appendChild(box);
});
</script>
</body>
</html>
